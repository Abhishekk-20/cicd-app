name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Lint and Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Unit tests
        run: python -m pytest -v

  image:
    name: Build, Scan and Publish
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build image for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.name }}:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL

      - name: Push image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}

  deploy:
    name: Approve and Update GitOps
    runs-on: ubuntu-latest
    needs: image
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      secrets.GITOPS_TOKEN != ''

    environment:
      name: production

    permissions:
      contents: read

    steps:
      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: Abhishekk-20/cicd-app-gitops
          ref: main
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      - name: Update GitOps image tag
        working-directory: gitops
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          sed -i -E "s|^  tag:.*|  tag: \"${IMAGE_TAG}\"|" \
            charts/cicd-app/values.yaml
          grep -n '^  tag:' charts/cicd-app/values.yaml

      - name: Commit and push GitOps update
        working-directory: gitops
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add charts/cicd-app/values.yaml

          if git diff --cached --quiet; then
            echo "Image tag is already current."
            exit 0
          fi

          git commit -m "Deploy cicd-app ${IMAGE_TAG}"
          git push origin main

  notify-failure:
    name: Notify Slack on Failure
    runs-on: ubuntu-latest
    needs: [test, image, deploy]
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      (needs.test.result == 'failure' ||
       needs.image.result == 'failure' ||
       needs.deploy.result == 'failure')

    steps:
      - name: Send Slack notification
        if: ${{ secrets.SLACK_WEBHOOK_URL != '' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          message=":x: CI/CD pipeline failed for ${REPO} on ${BRANCH}. Commit: ${COMMIT}. Details: ${RUN_URL}"

          jq -n --arg text "$message" '{text: $text}' |
            curl --fail --silent --show-error \
              -X POST \
              -H 'Content-type: application/json' \
              --data-binary @- \
              "$SLACK_WEBHOOK_URL"
